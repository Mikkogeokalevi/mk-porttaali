<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <title>MK Porttaali v2.18.10</title>
  
  <link rel="icon" type="image/png" href="mklogo.png">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="MK Porttaali — geokätköilijän työkalut: löytötilastot, kunta- ja maakartat, muuntimet ja reissuapuri.">
  <meta property="og:title" content="MK Porttaali">
  <meta property="og:description" content="Geokätköilijän työkalut: tilastot, kunta- ja maakartat, muuntimet, reissuapuri.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="mklogo.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MK Porttaali">
  <link rel="apple-touch-icon" href="mklogo.png">
  
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

</head>
<body>

  <header>
    <a href="#" class="brand" onclick="app.router('home'); return false;">
      <img src="mklogo.png" alt="MK Porttaali">
    </a>
    <button class="mobile-toggle" onclick="app.toggleMenu()">☰</button>
    <nav id="mainNav">
      <ul>
        <li><button class="nav-btn" data-view="home" onclick="app.router('home')">Etusivu</button></li>
        <li><button class="nav-btn" data-view="generator" onclick="app.router('generator')">Kuvageneraattori</button></li>
        <li><button class="nav-btn" data-view="stats" onclick="app.router('stats')">Tilastot</button></li>
        <li><button class="nav-btn" data-view="links" onclick="app.router('links')">Linkkikirjasto</button></li>
        <li><button class="nav-btn" data-view="help" onclick="app.router('help')">Ohjeet & Tuki</button></li>
      </ul>
      <div id="authContainer">
        <span id="userNameDisplay" class="user-info hidden"></span>
        <button id="authButton" class="nav-btn" onclick="app.router('login_view')">Kirjaudu</button>
        <button id="logoutButton" class="nav-btn hidden" onclick="app.logout()">Ulos</button>
      </div>
    </nav>
  </header>

  <main id="appContent">
    <div style="text-align: center; margin-top: 50px;">Ladataan sovellusta...</div>
  </main>

  <script type="module" src="app.js"></script>
  <div id="swUpdateBanner" style="display:none; position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); z-index:9999; background:#313244; color:#cdd6f4; border:1px solid #f9e2af; border-radius:10px; padding:12px 14px; align-items:center; gap:12px; box-shadow:0 4px 18px rgba(0,0,0,.5); font-size:.95em;">
    <span style="flex:1;">🔄 Uusi versio asennettu — päivitä sivu saadaksesi sen käyttöön.</span>
    <button class="btn btn-sm btn-primary" onclick="location.reload()">Päivitä</button>
    <button class="btn btn-sm" onclick="document.getElementById('swUpdateBanner').style.display='none'" style="padding:4px 10px;">Myöhemmin</button>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      const showSwUpdate = () => {
        const b = document.getElementById('swUpdateBanner');
        if (b) b.style.display = 'flex';
      };
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('Service Worker rekisteröity: ', reg.scope);
            // Uusi SW odottaa tai asentui juuri -> ilmoita käyttäjälle
            if (reg.waiting) showSwUpdate();
            reg.addEventListener('updatefound', () => {
              const sw = reg.installing;
              if (sw) sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) showSwUpdate();
              });
            });
          })
          .catch(err => console.log('Service Worker virhe: ', err));
      });
      // Jos sivun ohjaava SW vaihtuu (skipWaiting), kehoita päivittämään
      navigator.serviceWorker.addEventListener('controllerchange', showSwUpdate);
    }
  </script>
</body>
</html>
